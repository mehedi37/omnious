name: Omnious Graph Sync

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize]

jobs:
  sync:
    name: Sync Code Graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Omnious CLI
        run: npm install -g @omnious/cli@latest

      - name: Index & Push
        id: push
        run: |
          omnious index
          OUTPUT=$(omnious push --api-key "$OMNIOUS_API_KEY" 2>&1) || true
          echo "$OUTPUT"
          # Extract counts from push output for PR comment
          NODES=$(echo "$OUTPUT" | grep -oP 'Nodes.*?(\d+)' | grep -oP '\d+' | tail -1 || echo "0")
          EDGES=$(echo "$OUTPUT" | grep -oP 'Edges.*?(\d+)' | grep -oP '\d+' | tail -1 || echo "0")
          echo "nodes=$NODES" >> "$GITHUB_OUTPUT"
          echo "edges=$EDGES" >> "$GITHUB_OUTPUT"
        env:
          OMNIOUS_API_KEY: ${{ secrets.OMNIOUS_API_KEY }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const nodes = '${{ steps.push.outputs.nodes }}' || '0';
            const edges = '${{ steps.push.outputs.edges }}' || '0';
            const body = [
              '### 🔮 Omnious Graph Sync',
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Nodes synced | ${nodes} |`,
              `| Edges synced | ${edges} |`,
              '',
              `Graph updated from commit \`${context.sha.slice(0, 7)}\`.`,
              '',
              '_Powered by [Omnious](https://omnious.dev) — AI-native code intelligence_',
            ].join('\n');

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.includes('Omnious Graph Sync')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
